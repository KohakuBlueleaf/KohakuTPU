<!doctype html>
<meta charset="utf-8">
<title>KohakuTPU playground</title>
<style>
  :root { color-scheme: dark; --bg:#14161a; --fg:#d8dee9; --dim:#7a8494;
          --line:#262b33; --accent:#8fbcbb; --warn:#bf616a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); display:flex;
         height:100vh; font:13px/1.5 ui-monospace, Menlo, Consolas, monospace; }
  #left { width:46%; display:flex; flex-direction:column; border-right:1px solid var(--line); }
  #right { flex:1; overflow:auto; }
  header { padding:10px 14px; border-bottom:1px solid var(--line); display:flex;
           gap:10px; align-items:center; flex-wrap:wrap; }
  h1 { font-size:13px; margin:0 8px 0 0; color:var(--accent); font-weight:600; }
  select, button { background:#1c2027; color:var(--fg); border:1px solid var(--line);
                   border-radius:4px; padding:4px 9px; font:inherit; }
  button { cursor:pointer; }
  button:hover { border-color:var(--accent); }
  textarea { flex:1; width:100%; background:#111316; color:var(--fg); border:0;
             padding:14px; font:inherit; resize:none; outline:none; tab-size:4; }
  .panel { border-bottom:1px solid var(--line); }
  .panel h2 { margin:0; padding:8px 14px; font-size:11px; letter-spacing:.12em;
              text-transform:uppercase; color:var(--dim); background:#171a1f;
              cursor:pointer; user-select:none; }
  .panel pre { margin:0; padding:12px 14px; white-space:pre; overflow-x:auto; }
  .panel.shut pre { display:none; }
  #err { color:var(--warn); white-space:pre-wrap; padding:12px 14px; }
  #hint { color:var(--dim); padding:8px 14px; border-top:1px solid var(--line); }
</style>

<div id="left">
  <header>
    <h1>KohakuTPU</h1>
    <select id="pick"></select>
    <button id="run">compile &amp; run</button>
    <span id="hint2" style="color:var(--dim)">ctrl-enter</span>
  </header>
  <textarea id="src" spellcheck="false"></textarea>
  <div id="hint">
    Define a <b>@kernel</b> called <b>kernel_fn</b>, a dict <b>INPUTS</b> of
    parameter&nbsp;→&nbsp;shape, and optionally <b>REFERENCE(**arrays)</b> in
    float64 and <b>KNOBS</b>.
  </div>
</div>

<div id="right">
  <div id="err"></div>
  <div id="panels"></div>
</div>

<script>
const EXAMPLES = {
"matmul": `# Symbols, not numbers -- and BEFORE the kernel, since a port is a
# default argument and defaults are evaluated at def time.
M, KD, N = dims("M, K, N")

@kernel
def kernel_fn(a=L.In(..., M, KD), b=L.In(N, KD), c=L.Out(..., M, N),
              *, gm=8, gn=8, nk=2):
    """a @ b.T -- the contraction, and nothing else."""
    with units(a.tiles(gm), b.tiles(gn)) as (i, j):
        acc = L.tile(gm, gn, nk)
        for k in loop(a.chunks32(nk)):
            acc += a[i, k] @ b[j, k]
        c[i, j] <<= acc

INPUTS = {"a": (64, 128), "b": (64, 128)}
REFERENCE = lambda a, b: a @ b.T
`,

"linear_silu (fused epilogue)": `M, KD, N = dims("M, K, N")

@kernel
def kernel_fn(x=L.In(..., M, KD), w=L.In(N, KD), y=L.Out(..., M, N),
              *, gm=8, gn=8, nk=2):
    """silu(x @ w.T) with the activation NEVER reaching DRAM.

    The expression on \`acc\` drains the tile across the NoC into a vector
    core, so the intermediate never exists. Look at MESH: temps is empty.
    """
    with units(x.tiles(gm), w.tiles(gn)) as (i, j):
        acc = L.tile(gm, gn, nk)
        for k in loop(x.chunks32(nk)):
            acc += x[i, k] @ w[j, k]
        y[i, j] <<= acc * L.recip(L.exp2(acc * -1.4426950408889634) + 1.0)

INPUTS = {"x": (64, 128), "w": (64, 128)}
REFERENCE = lambda x, w: (lambda t: t / (1 + np.exp(-t)))(x @ w.T)
`,

"linear_bias (per-channel)": `M, KD, N = dims("M, K, N")

@kernel
def kernel_fn(x=L.In(..., M, KD), w=L.In(N, KD), bias=L.In(N),
              y=L.Out(..., M, N), *, gm=8, gn=8, nk=2):
    """x @ w.T + bias, the bias read PER CHANNEL beside the resident tile.

    \`bias\` is declared at its true shape, (N). It is not broadcast to M*N:
    \`bias[j]\` reads one word per column group at stride 0.
    """
    with units(x.tiles(gm), w.tiles(gn)) as (i, j):
        acc = L.tile(gm, gn, nk)
        for k in loop(x.chunks32(nk)):
            acc += x[i, k] @ w[j, k]
        y[i, j] <<= acc + bias[j]

INPUTS = {"x": (64, 128), "w": (64, 128), "bias": (64,)}
REFERENCE = lambda x, w, bias: x @ w.T + bias
`,

"softmax, fused": `M, N = dims("M, N")

@kernel
def kernel_fn(x=L.In(..., M, N), y=L.Out(..., M, N), *, part=8192):
    """Row-wise softmax in ONE tiling.

    \`ex\` is read twice, so it is computed once into a register and both the
    sum and the divide take it from there. Compare the stage count with the
    staged form -- four passes become one.
    """
    with units(x.parts(part)) as e:
        ex = L.exp2((x[e] - L.row_max(x[e])) * 1.4426950408889634)
        y[e] <<= ex / L.row_sum(ex)

INPUTS = {"x": (64, 128)}
def REFERENCE(x):
    e = np.exp(x - x.max(1, keepdims=True))
    return e / e.sum(1, keepdims=True)
`,

"softmax, staged (the slow shape)": `M, N = dims("M, N")

@kernel
def kernel_fn(x=L.In(..., M, N), y=L.Out(..., M, N)):
    """The SAME arithmetic, one pass per intermediate.

    Every \`<<=\` at the top level is a DRAM round trip. Look at STAGES: four
    of them, and three full-shape temps that did not need to exist.
    """
    hi, ex, total = L.temp(M, N), L.temp(M, N), L.temp(M, N)
    hi <<= L.row_max(x)
    ex <<= L.exp2((x - hi) * 1.4426950408889634)
    total <<= L.row_sum(ex)
    y <<= ex / total

INPUTS = {"x": (64, 128)}
def REFERENCE(x):
    e = np.exp(x - x.max(1, keepdims=True))
    return e / e.sum(1, keepdims=True)
`,

"rmsnorm, fused": `M, N = dims("M, N")

@kernel
def kernel_fn(x=L.In(..., M, N), w=L.In(..., M, N), y=L.Out(..., M, N),
              *, eps=1e-5, part=8192):
    """x * rsqrt(mean(x^2) + eps) * w, in one band.

    The sum is an E8M15 accumulator and never lands in memory, so scaling
    before squaring is a lowering decision rather than the author's.
    """
    with units(x.parts(part)) as e:
        ms = L.row_sum((x[e] / N) * x[e])
        y[e] <<= x[e] * L.rsqrt(ms + eps) * w[e]

INPUTS = {"x": (64, 128), "w": (64, 128)}
REFERENCE = lambda x, w: x / np.sqrt((x**2).mean(1, keepdims=True) + 1e-5) * w
`,

"layernorm -- two folds, one band": `M, N = dims("M, N")

@kernel
def kernel_fn(x=L.In(..., M, N), w=L.In(..., M, N), b=L.In(..., M, N),
              y=L.Out(..., M, N), *, eps=1e-5, part=8192):
    """(x - mean) * rstd * w + b, two reductions deep.

    The second fold reads the first's result, so a value has to be carried
    ACROSS a VRED. Exactly 8 of 8 descriptors, with no margin.
    """
    with units(x.parts(part)) as e:
        mu = L.row_sum(x[e]) / N
        dev = x[e] - mu
        var = L.row_sum((dev / N) * dev)
        y[e] <<= dev * L.rsqrt(var + eps) * w[e] + b[e]

INPUTS = {"x": (64, 128), "w": (64, 128), "b": (64, 128)}
def REFERENCE(x, w, b):
    d = x - x.mean(1, keepdims=True)
    return d / np.sqrt((d**2).mean(1, keepdims=True) + 1e-5) * w + b
`,

"elementwise, any rank": `@kernel
def kernel_fn(x=L.In(...), y=L.Out(...), *, part=8192):
    """silu over one contiguous block, whatever rank arrives.

    \`L.In(...)\` is "any shape at all": this walks elements and never asks
    how they are arranged. Change INPUTS to (2, 3, 8, 32) and nothing else.
    """
    with units(x.parts(part)) as e:
        y[e] <<= x[e] * L.recip(L.exp2(x[e] * -1.4426950408889634) + 1.0)

INPUTS = {"x": (2, 3, 8, 32)}
REFERENCE = lambda x: x / (1 + np.exp(-x))
`,

"swiglu -- two accumulators, one core": `M, KD, N = dims("M, K, N")
LOG2E = 1.4426950408889634

@kernel
def kernel_fn(x=L.In(M, KD), up=L.In(N, KD), gate=L.In(N, KD), y=L.Out(M, N),
              *, gm=8, gn=8, nk=2):
    """Two GEMMs fused on ONE vector core, with no temp and no round trip.

    A cluster holds one accumulator, so the first tile is drained ABOVE the
    sweep that clears it. Two drains into two L1 slots, one vector program
    reading both. Look at the stages panel: one MG stage, one VC stage.
    """
    with units(x.tiles(gm), up.tiles(gn)) as (i, j):
        a = L.tile(gm, gn, nk)
        for k in loop(x.chunks32(nk)):
            a += x[i, k] @ up[j, k]
        g = L.tile(gm, gn, nk)
        for k in loop(x.chunks32(nk)):
            g += x[i, k] @ gate[j, k]
        y[i, j] <<= a * (g * L.recip(L.exp2(g * -LOG2E) + 1.0))

INPUTS = {"x": (32, 64), "up": (64, 64), "gate": (64, 64)}

def REFERENCE(x, up, gate):
    a, g = x @ up.T, x @ gate.T
    return a * (g / (1.0 + np.exp(-g)))
`,

"a refusal -- two tile shapes": `M, KD, N = dims("M, K, N")

@kernel
def kernel_fn(x=L.In(M, KD), w=L.In(N, KD), y=L.Out(M, N),
              *, gm=8, gn=8, nk=2):
    """Two tiles fuse onto one core; two SIZES do not.

    The delivered tiles land in EQUAL spans of one core's L1, so the compiler
    says so instead of picking a span and being wrong on one of them.
    """
    with units(x.tiles(gm), w.tiles(gn)) as (i, j):
        a = L.tile(gm, gn, nk)
        for k in loop(x.chunks32(nk)):
            a += x[i, k] @ w[j, k]
        b = L.tile(gm, gn * 2, nk)
        for k in loop(x.chunks32(nk)):
            b += x[i, k] @ w[j, k]
        y[i, j] <<= a * b

INPUTS = {"x": (32, 64), "w": (64, 64)}
`
};

const src = document.getElementById("src");
const pick = document.getElementById("pick");
const panels = document.getElementById("panels");
const err = document.getElementById("err");

for (const name of Object.keys(EXAMPLES)) {
  const o = document.createElement("option");
  o.value = o.textContent = name;
  pick.appendChild(o);
}
pick.onchange = () => { src.value = EXAMPLES[pick.value]; run(); };
src.value = EXAMPLES[Object.keys(EXAMPLES)[0]];

const ORDER = ["dsl", "stages", "instructions", "cost", "mesh", "check"];
const TITLE = {
  dsl: "level 4 -- the kernel you wrote",
  stages: "levels 3 & 2 -- stages, grids, statements",
  instructions: "levels 1 & 0 -- the instruction stream, decoded",
  cost: "cycles -- analytic, and a bracket",
  mesh: "mesh -- what crossed the machine",
  check: "numbers -- graded against float64"
};

async function run() {
  err.textContent = "compiling...";
  let got;
  try {
    const res = await fetch("/compile", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({source: src.value})
    });
    got = await res.json();
  } catch (e) {
    err.textContent = "the server is not answering: " + e;
    return;
  }
  err.textContent = got.error || "";
  panels.innerHTML = "";
  if (got.error) return;
  for (const name of ORDER) {
    if (!got[name]) continue;
    const box = document.createElement("div");
    box.className = "panel";
    const h = document.createElement("h2");
    h.textContent = TITLE[name] || name;
    h.onclick = () => box.classList.toggle("shut");
    const pre = document.createElement("pre");
    pre.textContent = got[name];
    box.appendChild(h); box.appendChild(pre); panels.appendChild(box);
  }
}

document.getElementById("run").onclick = run;
src.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); run(); }
});
run();
</script>

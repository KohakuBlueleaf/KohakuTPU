[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kohakuaccel-compiler"
version = "0.1.0"
description = "Compiler framework for KohakuAccel machines"
requires-python = ">=3.13"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
tinygrad = ["tinygrad>=0.13"]

# PEP 420 namespaces shared with driver/; nothing collides because no module
# name appears in both -- hence `machinespec`, not `machine`.
[tool.setuptools.packages.find]
where = ["."]
include = ["kohakuaccel*", "kohakutpu*", "ktpugrad*"]
namespaces = true

# The playground is one HTML file served by `python -m kohakutpu.viz`.
[tool.setuptools.package-data]
"kohakutpu.viz" = ["*.html"]

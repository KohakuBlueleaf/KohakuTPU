# Tool settings for the hardware-flow scripts and benches at the root. The
# software is its own uv workspace: software/pyproject.toml.

# black formats, ruff lints. Same line length or they fight over every wrap.
[tool.black]
line-length = 88
target-version = ["py313"]
extend-exclude = "software/"

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["software"]

[tool.ruff.lint.per-file-ignores]
# UP031: 442 `%` format strings across 34 generators and golden models, most of
# them aligned table rows; `%` is not a defect.
"tests/pe/tools/*" = ["BLE001", "UP031"]

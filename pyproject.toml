[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ktpu"
version = "0.1.0"
description = "Compiler and runtime for KohakuTPU"
authors = [
    { name = "Shih-Ying Yeh (KohakuBlueLeaf)", email = "apolloyeh0123@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.13"
# numpy for the numeric model and the operand packer, and nothing else in the
# core. A pure-Python stack stays inspectable; a dependency has to remove more
# code than it adds. See docs/driver/README.md s5.
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "black>=24.0"]
# torch is needed only to check our MX quantiser against somebody else's; a
# format comparison where we wrote both sides proves nothing. See ktpu.hw.refimpl.
compare = ["torch>=2.4", "torchao>=0.7"]

[project.scripts]
ktpu = "ktpu.cli:main"

# src/ is the whole project's source root -- src/kohakunoc, src/kohakutpu and
# friends are Verilog packages and have no __init__.py, so `find` skips them.
# `include` says so explicitly rather than relying on that.
[tool.setuptools.packages.find]
where = ["src"]
include = ["ktpu*"]

# The visualiser is one HTML file served by scripts/py/server.py, so it ships
# with the package rather than being a separate asset tree.
[tool.setuptools.package-data]
"ktpu.viz" = ["*.html"]

# black formats, ruff lints. Same line length or they fight over every wrap.
[tool.black]
line-length = 88
target-version = ["py313"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.pytest.ini_options]
# tests/ mirrors src/: tests/noc, tests/matmul and friends are Verilog benches
# driven by scripts/py/xsim.py, tests/ktpu is Python.
testpaths = ["tests/ktpu"]

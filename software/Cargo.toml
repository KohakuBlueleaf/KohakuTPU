[workspace]
resolver = "2"
members = [
    "kohakuaccel/compiler/crates/ka-machine",
    "kohakuaccel/compiler/crates/ka-isa",
    "kohakuaccel/compiler/crates/ka-package",
    "kohakutpu/compiler/crates/ktpu-machine",
    "kohakutpu/compiler/crates/ktpu-isa",
    "kohakutpu/compiler/crates/ktpu-l0",
    "kohakutpu/compiler/crates/ktpu-l1",
    "kohakutpu/compiler/crates/ktpu-l2",
    "kohakutpu/compiler/crates/ktpu-verify",
    "kohakutpu/compiler/crates/ktpu-graph",
    "kohakutpu/compiler/crates/ktpu-kernels",
    "kohakuaccel/compiler/crates/ka-cache",
    "kohakutpu/compiler/crates/ktpu-debug",
    "kohakutpu/compiler/crates/ktpu",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
ka-machine = { path = "kohakuaccel/compiler/crates/ka-machine" }
ka-isa = { path = "kohakuaccel/compiler/crates/ka-isa" }
ka-package = { path = "kohakuaccel/compiler/crates/ka-package" }
ktpu-machine = { path = "kohakutpu/compiler/crates/ktpu-machine" }
ktpu-isa = { path = "kohakutpu/compiler/crates/ktpu-isa" }
ktpu-l0 = { path = "kohakutpu/compiler/crates/ktpu-l0" }
ktpu-l1 = { path = "kohakutpu/compiler/crates/ktpu-l1" }
ktpu-l2 = { path = "kohakutpu/compiler/crates/ktpu-l2" }
ktpu-verify = { path = "kohakutpu/compiler/crates/ktpu-verify" }
ktpu-graph = { path = "kohakutpu/compiler/crates/ktpu-graph" }
ktpu-kernels = { path = "kohakutpu/compiler/crates/ktpu-kernels" }
ka-cache = { path = "kohakuaccel/compiler/crates/ka-cache" }
ktpu-debug = { path = "kohakutpu/compiler/crates/ktpu-debug" }
ktpu = { path = "kohakutpu/compiler/crates/ktpu" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }
pest = "2.7"
pest_derive = "2.7"
sha2 = "0.10"
thiserror = "2"
rayon = "1.10"
pyo3 = { version = "0.27", features = ["extension-module"] }
wasm-bindgen = "0.2"

# Tests run on the dev profile; the parser and golden tests need optimised
# code to stay under the 1-minute workspace budget.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1

[workspace]
resolver = "2"
members = [
    "crates/ktpu-machine",
    "crates/ktpu-isa",
    "crates/ktpu-l0",
    "crates/ktpu-l1",
    "crates/ktpu-l2",
    "crates/ktpu-verify",
    "crates/ktpu-graph",
    "crates/ktpu-kernels",
    "crates/ktpu-plan",
    "crates/ktpu-cache",
    "crates/ktpu-debug",
    "crates/ktpu",
    "crates/ktpu-spec",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
ktpu-machine = { path = "crates/ktpu-machine" }
ktpu-isa = { path = "crates/ktpu-isa" }
ktpu-l0 = { path = "crates/ktpu-l0" }
ktpu-l1 = { path = "crates/ktpu-l1" }
ktpu-l2 = { path = "crates/ktpu-l2" }
ktpu-verify = { path = "crates/ktpu-verify" }
ktpu-graph = { path = "crates/ktpu-graph" }
ktpu-kernels = { path = "crates/ktpu-kernels" }
ktpu-plan = { path = "crates/ktpu-plan" }
ktpu-cache = { path = "crates/ktpu-cache" }
ktpu-debug = { path = "crates/ktpu-debug" }
ktpu = { path = "crates/ktpu" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }
pest = "2.7"
pest_derive = "2.7"
sha2 = "0.10"
thiserror = "2"
rayon = "1.10"
pyo3 = { version = "0.27", features = ["extension-module"] }
wasm-bindgen = "0.2"

# Tests run on the dev profile; the parser and golden tests need optimised
# code to stay under the 1-minute workspace budget.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1

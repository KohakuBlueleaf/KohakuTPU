[package]
name = "ktpu-kernels"
description = "The kernel generators the tensor planner calls, each building a ktpu-graph Graph."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Thread-local switches that break one generator decision (spec mutants).
mutants = []

[dependencies]
ktpu-graph.workspace = true
ktpu-machine.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha1_smol = "1"

[[example]]
name = "reverse_regold"
required-features = ["mutants"]

[dev-dependencies]
serde.workspace = true
sha2.workspace = true

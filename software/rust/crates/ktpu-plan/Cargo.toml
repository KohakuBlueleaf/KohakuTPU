[package]
name = "ktpu-plan"
description = "The tensor planner: tinygrad asts and kp graphs into step programs of kernel graphs."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Spec-vector mutants, switched per thread (src/mutant.rs).
mutants = ["ktpu-kernels/mutants"]

[dependencies]
ktpu-graph.workspace = true
ktpu-isa.workspace = true
ktpu-kernels.workspace = true
ktpu-machine.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2.workspace = true

[dev-dependencies]
# Golden comparisons include reversal witnesses for exact allocation bounds.
ktpu-plan = { path = ".", features = ["mutants"] }

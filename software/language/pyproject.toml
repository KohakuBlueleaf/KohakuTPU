[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kohakutpu-language"
version = "0.1.0"
description = "The .ktpu language: text, L3 / L2 / L1, lowering and optimisers, kernels"
requires-python = ">=3.13"
dependencies = ["numpy>=1.26", "lark>=1.2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["kohakutpu*"]
namespaces = true

[tool.setuptools.package-data]
"kohakutpu.language.text" = ["*.lark"]
"kohakutpu.language.kernels" = ["**/*.ktpu"]

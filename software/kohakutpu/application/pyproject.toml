[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kohakutpu-application"
version = "0.1.0"
description = "What runs on KohakuTPU: a skeleton, and the kernel tools"
requires-python = ">=3.13"
dependencies = [
    "numpy>=1.26",
    "kohakutpu-language",
    "kohakutpu-compiler",
    "kohakutpu-driver",
    "kohakutpu-simulation",
]

[tool.uv.sources]
kohakutpu-language = { path = "../language", editable = true }
kohakutpu-compiler = { path = "../compiler", editable = true }
kohakutpu-driver = { path = "../driver", editable = true }
kohakutpu-simulation = { path = "../simulation", editable = true }

[tool.setuptools.packages.find]
where = ["."]
include = ["kohakutpu*"]
namespaces = true

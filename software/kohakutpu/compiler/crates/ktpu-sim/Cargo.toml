[package]
name = "ktpu-sim"
description = "Value simulators of the KohakuTPU levels: each runs a level's program as its stage's reference and shares no lowering with the compiler."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ktpu-isa.workspace = true
ktpu-l0.workspace = true
ktpu-l1.workspace = true
ktpu-machine.workspace = true

[dev-dependencies]
ktpu-l2.workspace = true
ktpu-kernels.workspace = true
ktpu-graph.workspace = true
ktpu-verify.workspace = true
ka-package.workspace = true
ka-emu.workspace = true
ktpu = { workspace = true, features = ["mutants"] }
rayon.workspace = true
serde_json.workspace = true


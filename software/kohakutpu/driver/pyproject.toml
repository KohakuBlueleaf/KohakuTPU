[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kohakutpu-driver"
version = "0.1.0"
description = "KohakuTPU's card: clocks, units, host entry points, daemon"
requires-python = ">=3.13"
dependencies = ["numpy>=1.26", "kohakuaccel-driver", "kohakutpu-language"]

[tool.uv.sources]
kohakuaccel-driver = { path = "../../kohakuaccel/driver", editable = true }
kohakutpu-language = { path = "../language", editable = true }

[tool.setuptools.packages.find]
where = ["."]
include = ["kohakutpu*"]
namespaces = true

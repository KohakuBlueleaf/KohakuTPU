[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "kohaku-compiler"
version = "0.1.0"
description = "IR to machine code: the KohakuAccel backend framework and KohakuTPU's encoders"
requires-python = ">=3.13"
dependencies = ["numpy>=1.26", "kohakutpu-language"]

[tool.uv.sources]
kohakutpu-language = { workspace = true }

# The Python packages here plus the Rust stack (software/rust, crate ktpu) as
# the extension module kohakutpu.compiler._rs:
#   cd software/compiler && VIRTUAL_ENV=../.venv maturin develop --uv
[tool.maturin]
manifest-path = "../rust/crates/ktpu/Cargo.toml"
python-source = "."
module-name = "kohakutpu.compiler._rs"
python-packages = ["kohakuaccel"]
features = ["python"]

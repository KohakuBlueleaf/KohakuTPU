[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "toyaccel"
version = "0.1.0"
description = "A toy accelerator on the KohakuAccel framework: the template a project starts from"
requires-python = ">=3.13"
dependencies = ["kohakuaccel-compiler", "kohakuaccel-driver", "kohakuaccel-simulation"]

[tool.uv.sources]
kohakuaccel-compiler = { path = "../kohakuaccel/compiler", editable = true }
kohakuaccel-driver = { path = "../kohakuaccel/driver", editable = true }
kohakuaccel-simulation = { path = "../kohakuaccel/simulation", editable = true }

[tool.setuptools.packages.find]
where = ["."]
include = ["toyaccel*"]
namespaces = true
